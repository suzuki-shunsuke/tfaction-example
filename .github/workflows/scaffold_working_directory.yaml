---
# https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/scaffold-working-directory
name: Scaffold a working directory
run-name: Scaffold a working directory (${{inputs.working_dir}})
on:
  workflow_dispatch:
    inputs:
      working_dir:
        description: working directory
        required: true
env:
  TFACTION_WORKING_DIR: ${{github.event.inputs.working_dir}}
jobs:
  scaffold:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1

      - uses: suzuki-shunsuke/tfaction@v2.3.4
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/scaffold-working-directory
        with:
          action: scaffold-working-dir

      - name: Generate a GitHub access token
        id: generate_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # Push a commit
          permission-pull-requests: write # Create a pull request

      - uses: suzuki-shunsuke/tfaction@v2.3.4
        # https://suzuki-shunsuke.github.io/tfaction/docs/unreleased/scaffold-working-directory
        with:
          action: create-scaffold-pr
          github_token: ${{ steps.generate_token.outputs.token }}
