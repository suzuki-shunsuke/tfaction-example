---
# This workflow is optional.
name: opa-fmt
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
jobs:
  opa-fmt:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read # To checkout private repositories
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # Push commits

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0

      - uses: suzuki-shunsuke/github-action-opa-fmt@v0.1.0
        with:
          github_token: ${{steps.token.outputs.token}}
