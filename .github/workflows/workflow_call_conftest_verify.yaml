---
# This workflow is optional.
name: conftest verify
on: workflow_call
jobs:
  conftest-verify:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install conftest and github-comment
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1

      - name: conftest verify
        run: github-comment exec -- conftest verify --no-color -p policy/terraform
        env:
          GITHUB_TOKEN: ${{github.token}}
